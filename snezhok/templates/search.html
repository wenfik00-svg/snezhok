{% extends "base.html" %}{% from "_p.html" import post, av with context %}{% block c %}
<h2>Люди</h2>{% for u in users %}<a class="row2" href="{{ url_for('profile', name=u.name) }}">{{ av(u.name,"big") }}<div><b>{{ u.name }}</b><small>{{ u.bio }}</small></div></a>{% else %}<p class="muted">Никого не нашли</p>{% endfor %}
<h2>Посты</h2>{% for p in posts %}{{ post(p) }}{% else %}<p class="muted">Постов нет</p>{% endfor %}{% endblock %}
